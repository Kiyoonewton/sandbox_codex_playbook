<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Time Machine — Explore Internet Culture Year by Year</title>
  <meta name="description" content="Travel through internet culture from 2000 to 2025. Explore memes, technology, music, games, and online culture from every year.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Exo+2:wght@400;600;700;800&family=Fredoka:wght@400;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Poppins:wght@400;600;700;800&family=Press+Start+2P&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="glitter-overlay" class="glitter-overlay"></div>
  <nav class="nav-wrapper" role="navigation" aria-label="Year navigation">
    <div class="nav-inner">
      <div class="nav-header"><div class="nav-logo">🌐 Internet Time Machine <span>— 2000 to 2025</span></div></div>
      <div class="tab-scroll" id="tab-scroll"></div>
      <div class="tab-era-label" id="era-label">Internet Culture (2000-2003)</div>
      <div class="era-controls">
        <button class="era-btn undo-btn" id="undo-btn" onclick="undoYear()" title="Undo (Ctrl+Z)" aria-label="Undo" style="opacity:0.3">↩</button>
        <button class="era-btn redo-btn" id="redo-btn" onclick="redoYear()" title="Redo (Ctrl+Y)" aria-label="Redo" style="opacity:0.3">↪</button>
        <button class="era-btn random-btn" onclick="randomYear()" title="Random year (R)" aria-label="Random year">🎲</button>
        <button class="era-btn share-btn" onclick="shareYear()" title="Share this year" aria-label="Share this year">📤</button>
        <button class="era-btn fav-btn" onclick="toggleFavorite()" title="Favorite this year" aria-label="Favorite this year" id="fav-btn">☆</button>
        <button class="era-btn info-btn" onclick="toggleShortcuts()" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">⌨️</button>
      </div>
    </div>
  </nav>
  <div class="shortcuts-panel" id="shortcuts-panel">
    <div class="shortcuts-inner">
      <h4>Keyboard Shortcuts</h4>
      <div class="shortcut-row"><kbd>←</kbd> <kbd>→</kbd> Previous / Next year</div>
      <div class="shortcut-row"><kbd>Home</kbd> Jump to 2000</div>
      <div class="shortcut-row"><kbd>End</kbd> Jump to 2025</div>
      <div class="shortcut-row"><kbd>1</kbd>-<kbd>8</kbd> Expand category card</div>
      <div class="shortcut-row"><kbd>Esc</kbd> Collapse expanded cards</div>
      <div class="shortcut-row"><kbd>R</kbd> Random year</div>
      <div class="shortcut-row"><kbd>Ctrl+Z</kbd> Undo</div>
      <div class="shortcut-row"><kbd>Ctrl+Y</kbd> Redo</div>
    </div>
  </div>
  <main class="main-content" id="main-content" role="main" aria-label="Internet culture content"></main>
  <button class="scroll-top-btn" id="scroll-top" aria-label="Scroll to top">↑</button>
  <div class="keyboard-hint"><kbd>←</kbd> <kbd>→</kbd> Navigate years</div>
  <div class="loading-transition" id="loading-bar"></div>
  <script src="js/data_00_05.js"></script>
  <script src="js/data_06_11.js"></script>
  <script src="js/data_12_17.js"></script>
  <script src="js/data_18_25.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/category_accessibility.js"></script>
</body>
</html>
